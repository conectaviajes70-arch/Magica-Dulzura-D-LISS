<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>Mágica Dulzura D'LISSI | Escaparate</title>
<style>
:root{--black:#090909;--gold:#d8bd82;--goldlight:#f3e6c6;--cream:#fff9ed;--muted:#cfc5b0}
*{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--black)}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,rgba(216,189,130,.16),transparent 43%),var(--black);color:var(--cream);font-family:Georgia,"Times New Roman",serif}
.page{width:min(100%,920px);margin:0 auto;padding:0 18px 30px}
.brand{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px 8px 20px;border-bottom:1px solid rgba(216,189,130,.45)}
.logo{width:min(180px,38vw);height:auto;max-height:125px;object-fit:contain;margin-bottom:8px}
.brand-name{color:var(--goldlight);font-size:clamp(1.25rem,4vw,2rem);letter-spacing:.13em;line-height:1.2;text-transform:uppercase}
.brand-subtitle{color:var(--gold);font-family:Arial,sans-serif;font-size:.72rem;letter-spacing:.24em;margin-top:8px;text-transform:uppercase}
.intro{text-align:center;padding:20px 0 18px}.intro h1{margin:0;color:var(--goldlight);font-size:clamp(1.25rem,3.6vw,1.8rem);font-weight:normal;letter-spacing:.035em}
.intro p{margin:8px 0 0;color:var(--muted);font:500 .78rem/1.5 Arial,sans-serif;letter-spacing:.08em}
.gallery{display:grid;gap:20px}.product-frame{margin:0;padding:7px;border:1px solid rgba(216,189,130,.58);border-radius:13px;background:linear-gradient(145deg,#211d15,#0e0d0b);box-shadow:0 12px 28px rgba(0,0,0,.35)}
.product-image{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;border-radius:7px;background:#211d15}
.qr-section{margin-top:30px;padding:26px 14px 22px;text-align:center;border-top:1px solid rgba(216,189,130,.45);background:linear-gradient(180deg,transparent,rgba(216,189,130,.07))}
.qr-section h2{color:var(--goldlight);font-size:clamp(1.15rem,3.4vw,1.6rem);font-weight:normal;margin:0 0 7px;letter-spacing:.04em}
.qr-section p{margin:0 0 16px;color:var(--muted);font:.82rem/1.5 Arial,sans-serif}
.qr-box{width:min(220px,58vw);aspect-ratio:1;margin:0 auto;padding:10px;display:grid;place-items:center;border:1px dashed var(--gold);border-radius:10px;background:var(--cream)}
.qr-image{width:100%;height:100%;object-fit:contain}.qr-placeholder{color:#29251d;font:700 .8rem/1.5 Arial,sans-serif;text-align:center;padding:12px}
.footer{text-align:center;color:#9d927d;font:.68rem/1.5 Arial,sans-serif;letter-spacing:.1em;padding:20px 0 4px}
@media(min-width:700px){.page{padding-left:30px;padding-right:30px}.brand{min-height:190px}.logo{width:190px}.gallery{gap:28px}.product-frame{padding:9px;border-radius:16px}.product-image{aspect-ratio:5/4}.qr-section{margin-top:42px;padding:34px 20px 28px}}
</style>
</head>
<body><div class="page">
<header class="brand">
<!-- Coloca el logotipo en un archivo llamado logo.png junto a este HTML. -->
<img class="logo" src="logo.png" alt="Logotipo Mágica Dulzura D'LISSI" onerror="this.style.display='none'">
<div class="brand-name">Mágica Dulzura D'LISSI</div><div class="brand-subtitle">Un detalle dulce, un momento mágico</div>
</header>
<section class="intro"><h1>Déjate tentar</h1><p>Descubre nuestros postres</p></section>
<!-- Reemplaza las fotos conservando los nombres imagen1.png hasta imagen10.png. -->
<main class="gallery" aria-label="Galería de productos">
<figure class="product-frame"><img class="product-image" src="imagen1.png" alt="Postre 1" loading="eager"></figure>
<figure class="product-frame"><img class="product-image" src="imagen2.png" alt="Postre 2" loading="lazy"></figure>
<figure class="product-frame"><img class="product-image" src="imagen3.png" alt="Postre 3" loading="lazy"></figure>
<figure class="product-frame"><img class="product-image" src="imagen4.png" alt="Postre 4" loading="lazy"></figure>
<figure class="product-frame"><img class="product-image" src="imagen5.png" alt="Postre 5" loading="lazy"></figure>
<figure class="product-frame"><img class="product-image" src="imagen6.png" alt="Postre 6" loading="lazy"></figure>
<figure class="product-frame"><img class="product-image" src="imagen7.png" alt="Postre 7" loading="lazy"></figure>
<figure class="product-frame"><img class="product-image" src="imagen8.png" alt="Postre 8" loading="lazy"></figure>
<figure class="product-frame"><img class="product-image" src="imagen9.png" alt="Postre 9" loading="lazy"></figure>
<figure class="product-frame"><img class="product-image" src="imagen10.png" alt="Postre 10" loading="lazy"></figure>
</main>
<section class="qr-section"><h2>¡Escanea aquí!</h2><p>Conoce más de nuestro menú</p><div class="qr-box">
<img class="qr-image" src="codigo-qr.png" alt="Código QR para escanear" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
<div class="qr-placeholder" style="display:none">COLOCA AQUÍ<br>TU CÓDIGO QR</div></div></section>
<footer class="footer">MÁGICA DULZURA D'LISSI · HECHO CON DULZURA</footer>
</div></body></html>
